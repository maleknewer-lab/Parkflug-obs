<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden · Operations</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
</head>
<body data-page="login">
<div class="login page-login" id="login">
<div class="box">
<div class="logo" style="font-size:18px"><span class="m">P</span>Park Operations</div>
<div><h1>Anmelden</h1><p class="muted" style="margin:4px 0 0">Jeder Mitarbeiter meldet sich mit seiner eigenen E-Mail an. Die Schicht startet automatisch.</p></div>
<form action="/api/auth/login" class="card pad" method="post" style="display:grid;gap:10px">
<label class="field">E-Mail<input autocomplete="username" class="inp" id="lgMail" name="email" placeholder="name@parkflug.de" required="" type="email"/></label>
<label class="field">Passwort<input autocomplete="current-password" class="inp" id="lgPw" name="password" placeholder="••••••••" required="" type="password"/></label>
<div class="err" id="lgErr"></div>
<button class="btn lg" id="lgGo" type="submit">Anmelden</button>
</form>


</div>
</div>
</body>
</html>
